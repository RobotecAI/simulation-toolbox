# The decision table from the talk. `ref` values point at ids in simulators.yaml / tools.yaml.
rows:
  - problem: Software-in-the-loop stack tests
    candidates:
      - { name: Gazebo, ref: gazebo }
      - { name: O3DE, ref: o3de }
      - { name: Isaac Sim, ref: isaac-sim }
    factor: Control, sensors, photorealism
  - problem: Train a policy
    candidates:
      - { name: MuJoCo / Playground, ref: mujoco }
      - { name: Genesis World, ref: genesis }
      - { name: Isaac Lab, ref: isaac-sim }
    factor: Task and compute backend
  - problem: Large, rich scenes
    candidates:
      - { name: O3DE, ref: o3de }
      - { name: Unreal, ref: unreal }
    factor: Authoring and performance
  - problem: Custom physics
    candidates:
      - { name: Newton, ref: newton }
      - { name: Genesis World, ref: genesis }
      - { name: MuJoCo (backends), ref: mujoco }
    factor: Required solver features
  - problem: Policy benchmarks
    candidates:
      - { name: LIBERO, ref: libero }
      - { name: ManiSkill task suites, ref: sapien-maniskill }
    factor: Benchmark fit
