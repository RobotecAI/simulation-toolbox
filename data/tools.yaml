# Other tools mentioned in the talk, grouped as on the slides.
groups:
  - title: Learning and evaluation
    items:
      - id: schola
        name: Schola
        text: Unreal-to-Python RL integration with vectorized and multi-agent workflows. Useful for authored training environments.
        links:
          - { label: AMD Schola, url: "https://gpuopen.com/amd-schola/" }
      - id: sapien-maniskill
        name: SAPIEN + ManiSkill
        text: Articulated-object manipulation, including visual observations. ManiSkill adds tasks, datasets and learning infrastructure.
        links:
          - { label: SAPIEN, url: "https://sapien-sim.github.io/docs/index.html" }
          - { label: ManiSkill, url: "https://github.com/mani-skill/ManiSkill" }
      - id: libero
        name: LIBERO
        text: Tests transfer across objects, spatial layouts and task goals. Useful when policy evaluation needs a defined manipulation suite.
        links:
          - { label: Project page, url: "https://libero-project.github.io/main.html" }
  - title: Robotics and world building
    items:
      - id: drake
        name: Drake
        text: Manipulation with contact-rich physics, plus planning, trajectory optimization and controller design. Built for optimization rather than rollouts; gradients built in.
        links:
          - { label: drake.mit.edu, url: "https://drake.mit.edu/" }
          - { label: Repository, url: "https://github.com/RobotLocomotion/drake" }
      - id: webots
        name: Webots
        text: Robot models, sensors and controllers in an integrated environment. Useful for prototyping and repeatable controller experiments.
        links:
          - { label: Repository, url: "https://github.com/cyberbotics/webots" }
          - { label: webots_ros2 wiki, url: "https://github.com/cyberbotics/webots_ros2/wiki" }
      - id: unreal
        name: Unreal Engine
        text: Detailed environments, behavior authoring and visual simulation. Matters for photorealism.
        links:
          - { label: UE5 for robotics simulation, url: "https://www.unrealengine.com/spotlights/ue5-is-becoming-the-platform-of-choice-for-robotics-simulation" }
      - id: unity
        name: Unity
        text: Existing projects can reuse ros2-for-unity (no longer supported by Robotec.ai).
        links:
          - { label: ros2-for-unity, url: "https://github.com/RobotecAI/ros2-for-unity" }
          - { label: ML-Agents, url: "https://github.com/Unity-Technologies/ml-agents" }
          - { label: ROS-TCP-Connector, url: "https://github.com/Unity-Technologies/ROS-TCP-Connector" }
