# The core simulators covered in the talk, one entry each. Wording follows the slides.
#
#   id        anchor used by cheatsheet.yaml (#sim-<id>)
#   tags      sil | learning | physics  (drive the filter chips)
#   links     kind: release | docs | ros | learning | demo   (drives the chip colour)
#   verified  date the version label and links were last checked upstream

- id: gazebo
  name: Gazebo
  version: Jetty LTS
  released: 2025-09
  verified: 2026-09-17
  tags: [sil]
  points:
    - title: Great support for ROS packages
      text: Pairs with ROS 2 Jazzy and later. Most ROS packages ship Gazebo examples; ros_gz bridges topics and services.
    - title: Composable simulation
      text: Swap physics, rendering and sensors as plugins.
    - title: Community standard
      text: SDFormat, Fuel asset library, Python bindings; Zenoh transport in Jetty for ROS 2 interoperability. Jetty ships the Simulation Interfaces implementation.
  links:
    - { label: Documentation, url: "https://gazebosim.org/docs/latest/", kind: docs }
    - { label: Releases, url: "https://gazebosim.org/docs/latest/releases/", kind: release }
    - { label: Release notes, url: "https://gazebosim.org/docs/latest/release_notes/", kind: release }
    - { label: ros_gz_bridge, url: "https://github.com/gazebosim/ros_gz/tree/ros2/ros_gz_bridge", kind: ros }
    - { label: gz_ros2_control, url: "https://github.com/ros-controls/gz_ros2_control", kind: ros }
    - { label: Nav2 minimal simulation, url: "https://github.com/ros-navigation/nav2_minimal_turtlebot_simulation", kind: demo }

- id: o3de
  name: O3DE · Open 3D Engine
  version: 26.05.0
  released: 2026-05-27
  verified: 2026-09-17
  tags: [sil]
  points:
    - title: Operational environments
      text: Editor, prefabs and scripted behaviors model facilities and interacting subsystems.
    - title: Native ROS 2
      text: Custom messages, services and actions use ROS APIs directly. Built-in TF, time and namespaces, Nav2 and MoveIt.
    - title: Focused
      text: No support for robot learning; great for development, software-in-the-loop and operations.
  links:
    - { label: Robotics overview, url: "https://www.docs.o3de.org/docs/user-guide/interactivity/robotics/overview/", kind: docs }
    - { label: ROS 2 Gem reference, url: "https://www.docs.o3de.org/docs/user-guide/gems/reference/robotics/ros2/", kind: ros }
    - { label: 26.05.0 release notes, url: "https://github.com/o3de/sig-release/blob/main/releases/26.05.0/26.05.0.md", kind: release }
    - { label: All release notes, url: "https://docs.o3de.org/docs/release-notes/", kind: release }
    - { label: ROS 2 project templates, url: "https://www.docs.o3de.org/docs/learning-guide/samples/templates/", kind: demo }
    - { label: o3de-extras (gems), url: "https://github.com/o3de/o3de-extras", kind: ros }
    - { label: Agentic mobile manipulator demo, url: "https://github.com/RobotecAI/agentic-mobile-manipulator", kind: demo }
    - { label: RAI agent framework, url: "https://github.com/RobotecAI/rai", kind: demo }

- id: isaac-sim
  name: Isaac Sim
  version: "6.1"
  released: 2026-09-15
  verified: 2026-09-17
  tags: [sil, learning]
  points:
    - title: Sensors and physics
      text: RTX cameras, lidar and radar; PhysX or Newton (MuJoCo Warp) behind one API.
    - title: ROS 2 in the loop
      text: Bridge for Humble and Jazzy. 6.1 adds an in-process ros2_control manager. Isaac Lab trains on the same stack.
    - title: Hardware
      text: Needs an RTX GPU with RT cores (min. RTX 4080, 16 GB); no CPU or other-vendor path. Apache 2.0 code on a proprietary Kit SDK.
  links:
    - { label: 6.1 announcement, url: "https://forums.developer.nvidia.com/t/isaac-sim-6-1-general-availability/383280", kind: release }
    - { label: Requirements, url: "https://docs.isaacsim.omniverse.nvidia.com/6.1.0/installation/requirements.html", kind: docs }
    - { label: ROS 2 tutorials, url: "https://docs.isaacsim.omniverse.nvidia.com/6.1.0/ros2_tutorials/index.html", kind: ros }
    - { label: Custom ROS 2 messages, url: "https://docs.isaacsim.omniverse.nvidia.com/6.1.0/ros2_tutorials/custom_interfaces/tutorial_ros2_custom_message_python.html", kind: ros }
    - { label: Replicator tutorials, url: "https://docs.isaacsim.omniverse.nvidia.com/6.1.0/replicator_tutorials/index.html", kind: docs }
    - { label: Isaac Lab docs, url: "https://isaac-sim.github.io/IsaacLab/main/index.html", kind: learning }
    - { label: Isaac Lab repository, url: "https://github.com/isaac-sim/IsaacLab", kind: learning }

- id: mujoco
  name: MuJoCo
  version: 3.13.0
  released: 2026-09
  verified: 2026-09-17
  tags: [learning, physics]
  points:
    - title: Control mechanics
      text: Contacts, actuators, tendons and constraints suit locomotion and manipulation.
    - title: A ready learning stack
      text: Playground provides tasks and training examples; Menagerie provides robot models.
    - title: Execution choices
      text: CPU MuJoCo, MJX/JAX and MuJoCo Warp differ in supported features and hardware.
  links:
    - { label: Engine releases, url: "https://github.com/google-deepmind/mujoco/releases", kind: release }
    - { label: MuJoCo Playground, url: "https://playground.mujoco.org/", kind: learning }
    - { label: Playground repository, url: "https://github.com/google-deepmind/mujoco_playground", kind: learning }
    - { label: Menagerie robot models, url: "https://github.com/google-deepmind/mujoco_menagerie", kind: demo }
    - { label: MJX documentation, url: "https://mujoco.readthedocs.io/en/stable/mjx.html", kind: docs }
    - { label: Computation overview, url: "https://mujoco.readthedocs.io/en/stable/computation/index.html", kind: docs }

- id: newton
  name: Newton
  version: 1.6.0
  released: 2026-09
  verified: 2026-09-17
  tags: [learning, physics]
  points:
    - title: OpenUSD + MuJoCo + Warp
      text: An extensible GPU physics engine under the Linux Foundation.
    - title: Extensible physics
      text: Warp kernels and solver selection; deformables, gradients, constraints, material coupling.
    - title: Under LF but backend lock-in
      text: Requires Warp (CUDA JIT), so an NVIDIA backend.
  links:
    - { label: Repository and examples, url: "https://github.com/newton-physics/newton", kind: docs }
    - { label: Releases, url: "https://github.com/newton-physics/newton/releases", kind: release }
    - { label: Solver feature matrix, url: "https://newton-physics.github.io/newton/stable/solvers/index.html", kind: docs }

- id: genesis
  name: Genesis World
  version: 1.4.1
  released: 2026-09-12
  verified: 2026-09-17
  tags: [learning, physics]
  points:
    - title: Coupled physics
      text: Rigid, FEM, MPM and PBD/SPH solvers share one scene; explicit, SAP or IPC couplers resolve contact between them.
    - title: Task variation at scale
      text: Parallel and heterogeneous environments, domain randomization, batched IK and planning.
    - title: Beyond state-only policies
      text: Cameras (path-traced or raster), lidar, IMU, contact-force and tactile taxel grids; differentiable by design.
  links:
    - { label: Repository, url: "https://github.com/Genesis-Embodied-AI/genesis-world", kind: docs }
    - { label: Releases, url: "https://github.com/Genesis-Embodied-AI/genesis-world/releases", kind: release }
