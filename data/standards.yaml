title: Standards
simulation_interfaces:
  id: simulation-interfaces
  title: Simulation Interfaces
  status: ROS 2 standard
  points:
    - title: Reusable test workflows
      text: Interoperable scenario script controls spawning, entity state, reset and stepping.
    - title: Working examples
      text: Gazebo, O3DE and Isaac Sim share the warehouse scene. RViz2 control plugin.
    - title: Broader adoption
      text: Community Newton and Genesis World bridges implement subsets.
  image:
    src: img/shared-warehouse.jpg
    alt: The same warehouse scenario running in three simulators
    caption: The shared warehouse scenario in Gazebo, O3DE and Isaac Sim.
  links:
    - { label: simulation_interfaces, url: "https://github.com/ros-simulation/simulation_interfaces", kind: ros }
    - { label: Examples · warehouse scenario, url: "https://github.com/ros-simulation/simulation_interfaces_examples", kind: demo }
    - { label: ROSCon 2025 talk, url: "https://vimeo.com/1136376172", kind: video }
    - { label: Blog post, url: "https://www.robotec.ai/blog/robotics/standardizing-simulation-interfaces-for-open-source-robotics", kind: docs }
    - { label: Newton bridge (community), url: "https://github.com/vybhav-ibr/newton_ros/tree/main/newton_simulation_interfaces", kind: ros }
    - { label: Genesis bridge (community), url: "https://github.com/vybhav-ibr/genesis_ros/tree/main/gs_simulation_interfaces", kind: ros }

rep158:
  id: rep-158
  title: OpenUSD · REP-158
  status: In vote
  pillars:
    - title: Upstream standards and sim-ready assets
      text: Adopt OpenUSD standard and SimReady practices, modular composition, neutral physics plus optional simulator-specific layers.
    - title: Declarative ROS schemas
      text: Topics, services, actions and frames in the asset, independent of the simulator's implementation.
    - title: Compatibility and downstream export
      text: Efficient glTF and URDF export through material, geometry, instancing and variant rules.
    - title: A shared ecosystem
      text: Core schemas, extension registries and compliance tooling so assets can be checked and reused.
  links:
    - { label: Discourse · draft REP-158, url: "https://discourse.openrobotics.org/t/draft-rep-158-openusd-conventions-for-simulation-asset-interoperability-in-open-source-robotics/55526", kind: docs }
    - { label: REP-158 text, url: "https://github.com/openrobotics/reps/blob/main/_posts/rep-0158%3A2006.md", kind: docs }
    - { label: openusd-schemas, url: "https://github.com/ros-simulation/openusd-schemas", kind: ros }
