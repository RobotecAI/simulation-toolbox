title: Building with AI agents
items:
  - title: Skills
    text: Build skills for your simulator first, especially when versions carry large diffs (Gazebo / Ignition). Include skills that present you with renders and evidence.
  - title: Sim engineering
    text: As with most code, but spatio-temporal reasoning has limits and images cost input tokens. Have good validation methods and highest-signal artifacts to inspect.
  - title: Scene assembly and scenario testing
    text: Agents can quickly and quite successfully compose your assets into a reasonable scene. Use Simulation Interfaces.
  - title: 3D model and scene generation
    text: Simplified models can be generated from photos of the place. A good starting point.
