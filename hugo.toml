# Site configuration. Content lives in data/*.yaml and content/_index.md;
# presentation lives in layouts/ and assets/. Keep this file to plumbing.

# Overridden by the GitHub Actions workflow with the real Pages URL,
# so it works for any repository name or custom domain out of the box.
baseURL = "https://robotecai.github.io/simulation-toolbox/"
languageCode = "en"
title = "Simulation Toolbox · ROSCon 2026"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS", "section", "page"]

[params]
  # Set automatically in CI from the repository that builds the site.
  # Default lets local builds show the "source" links too; empty hides them.
  repourl = "https://github.com/RobotecAI/simulation-toolbox"

[markup.goldmark.renderer]
  unsafe = true

[minify]
  minifyOutput = true
