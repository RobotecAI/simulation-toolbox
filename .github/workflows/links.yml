# Weekly check that every external link in data/*.yaml still resolves.
# A failing run means a project moved or a release page changed; fix the YAML.
name: Check links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["data/**"]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check_links.sh
