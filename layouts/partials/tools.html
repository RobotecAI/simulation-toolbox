{{- $t := site.Data.tools -}}
<section class="section section-alt" id="tools">
  <div class="wrap">
    <h2>Other tools</h2>
    <div class="tool-groups">
    {{- range $t.groups }}
      <div class="tool-group">
        <h3>{{ .title }}</h3>
        <ul class="tool-list">
        {{- range .items }}
          <li id="sim-{{ .id }}">
            <div class="tool-name"><strong>{{ .name }}</strong></div>
            <p>{{ .text }}</p>
            <p class="tool-links">{{ range $i, $l := .links }}{{ if $i }} · {{ end }}<a href="{{ $l.url }}" rel="noopener">{{ $l.label }}</a>{{ end }}</p>
          </li>
        {{- end }}
        </ul>
      </div>
    {{- end }}
    </div>
  </div>
</section>
